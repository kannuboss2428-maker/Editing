<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon Ultra 3D - Open World Driving</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Modern Speedometer & HUD UI */
    .hud {
      position: absolute;
      bottom: 25px;
      right: 35px;
      background: rgba(12, 16, 26, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 20px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    .speed-val {
      font-size: 52px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .speed-unit {
      font-size: 14px;
      color: #8a94a6;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 4px;
    }

    .gear-box {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .gear-badge {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      padding: 6px 18px;
      border-radius: 10px;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    .nos-indicator {
      font-size: 12px;
      font-weight: 700;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
    }

    /* Car Selector Overlay */
    .selector-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(15, 17, 23, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
    }

    .car-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .car-btn:hover, .car-btn.active {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
    }

    /* Controls Guide Overlay */
    .controls-guide {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(12, 16, 26, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: #ccc;
      line-height: 1.8;
      pointer-events: none;
    }

    .key {
      background: #252836;
      color: #00f2fe;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid rgba(0,242,254,0.3);
    }

    /* Nitro Flame Effect Overlay Flash */
    .nitro-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(255, 0, 100, 0);
      transition: box-shadow 0.1s ease;
    }

    .nitro-active {
      box-shadow: inset 0 0 100px rgba(255, 0, 100, 0.4);
    }
  </style>

  <!-- Three.js Engine & Orbit Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div class="nitro-overlay" id="nitroFx"></div>

    <!-- Car Switcher -->
    <div class="selector-bar">
      <button class="car-btn active" id="btnEcco" onclick="switchCar('ecco')">🚐 EECO VAN (5 Lakh KM/H)</button>
      <button class="car-btn" id="btnBmw" onclick="switchCar('bmw')">🏎️ BMW M4 SPORT</button>
    </div>

    <!-- Keybind Guide -->
    <div class="controls-guide">
      <div><span class="key">W</span> / <span class="key">S</span> : Accelerate / Reverse</div>
      <div><span class="key">A</span> / <span class="key">D</span> : Steer Left / Right</div>
      <div><span class="key">SPACE</span> : Handbrake</div>
      <div><span class="key">E</span> / <span class="key">Q</span> : Shift Gear Up / Down (1-10)</div>
      <div><span class="key">SHIFT</span> : Exhaust Flame & Beast Boost ⚡</div>
    </div>

    <!-- Speed & Gear HUD -->
    <div class="hud">
      <div class="speed-val" id="speedometer">0</div>
      <div class="speed-unit">KM / H</div>
      <div class="gear-box">
        <div class="gear-badge" id="gearDisplay">G 1</div>
        <div class="nos-indicator" id="nosText">EXHAUST READY</div>
      </div>
    </div>
  </div>

  <script>
    // --- THREE.JS ENGINE SETUP ---
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d14);
    scene.fog = new THREE.FogExp2(0x0a0d14, 0.00015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // --- LIGHTING (Horizon Style Soft Sunlight) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.8);
    sunLight.position.set(1000, 2000, 1000);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 5000;
    const d = 1000;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // --- ULTRA HUGE OPEN WORLD MAP (BGMI Highway Level) ---
    const mapGroup = new THREE.Group();
    scene.add(mapGroup);

    // Giant Terrain
    const terrainGeo = new THREE.PlaneGeometry(30000, 30000, 64, 64);
    const terrainMat = new THREE.MeshStandardMaterial({
      color: 0x1a2417,
      roughness: 0.9,
      metalness: 0.1
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    mapGroup.add(terrain);

    // Endless Highway Loop Structure
    const roadWidth = 40;
    const roadLength = 25000;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.4 });

    // Main Highway
    const roadMain = new THREE.Mesh(roadGeo, roadMat);
    roadMain.rotation.x = -Math.PI / 2;
    roadMain.position.y = 0.1;
    roadMain.receiveShadow = true;
    mapGroup.add(roadMain);

    // Cross Highway
    const roadCross = new THREE.Mesh(new THREE.PlaneGeometry(roadLength, roadWidth), roadMat);
    roadCross.rotation.x = -Math.PI / 2;
    roadCross.position.y = 0.15;
    roadCross.receiveShadow = true;
    mapGroup.add(roadCross);

    // Road Markings (Lines)
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    for (let z = -roadLength / 2; z < roadLength / 2; z += 60) {
      const lineGeo = new THREE.PlaneGeometry(1.5, 30);
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.2, z);
      mapGroup.add(line);
    }

    // Street Lights & Environment Props Generator
    const poleGeo = new THREE.CylinderGeometry(0.3, 0.5, 18);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
    const lampGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const lampMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

    for (let z = -10000; z < 10000; z += 300) {
      [-24, 24].forEach(x => {
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(x, 9, z);
        pole.castShadow = true;
        mapGroup.add(pole);

        const lamp = new THREE.Mesh(lampGeo, lampMat);
        lamp.position.set(x, 18, z);
        mapGroup.add(lamp);
      });
    }

    // High Buildings / Scenery
    const bldgMat = new THREE.MeshStandardMaterial({ color: 0x1e2430, roughness: 0.3 });
    for (let i = 0; i < 150; i++) {
      const h = 50 + Math.random() * 200;
      const bldgGeo = new THREE.BoxGeometry(40 + Math.random() * 60, h, 40 + Math.random() * 60);
      const bldg = new THREE.Mesh(bldgGeo, bldgMat);
      const side = Math.random() > 0.5 ? 1 : -1;
      bldg.position.set(side * (80 + Math.random() * 800), h / 2, (Math.random() - 0.5) * 15000);
      bldg.castShadow = true;
      mapGroup.add(bldg);
    }

    // --- CAR VEHICLE BUILDERS ---
    const vehicleGroup = new THREE.Group();
    scene.add(vehicleGroup);

    let eccoMesh, bmwMesh;
    let exhaustFlames = [];

    // Create Exhaust Flame Particles
    const flameGeo = new THREE.ConeGeometry(0.4, 3, 8);
    flameGeo.rotateX(-Math.PI / 2);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });

    function createExhaust(x, y, z) {
      const flame = new THREE.Mesh(flameGeo, flameMat);
      flame.position.set(x, y, z);
      flame.visible = false;
      exhaustFlames.push(flame);
      return flame;
    }

    // 1. Maruti EECO Van Procedural 3D Model
    function buildEccoVan() {
      const ecco = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.2 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
      const bumperMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });

      // Main Box Body
      const bodyGeo = new THREE.BoxGeometry(4.2, 4.5, 9);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 3;
      body.castShadow = true;
      ecco.add(body);

      // Cabin Front Slope
      const frontGeo = new THREE.BoxGeometry(4.15, 2.2, 2.5);
      const front = new THREE.Mesh(frontGeo, bodyMat);
      front.position.set(0, 1.8, 4.5);
      ecco.add(front);

      // Windows
      const windshieldGeo = new THREE.PlaneGeometry(3.8, 2);
      const windshield = new THREE.Mesh(windshieldGeo, glassMat);
      windshield.position.set(0, 3.4, 4.56);
      windshield.rotation.x = -0.15;
      ecco.add(windshield);

      // Bumpers
      const bumperGeo = new THREE.BoxGeometry(4.3, 1.2, 0.5);
      const bumper = new THREE.Mesh(bumperGeo, bumperMat);
      bumper.position.set(0, 1.2, 5.75);
      ecco.add(bumper);

      // Exhaust Pipe + Flames
      ecco.add(createExhaust(-1.2, 0.8, -4.6));
      ecco.add(createExhaust(1.2, 0.8, -4.6));

      return ecco;
    }

    // 2. BMW M4 Sport Procedural 3D Model
    function buildBmwCar() {
      const bmw = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, metalness: 0.8, roughness: 0.2 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.05 });
      const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });

      // Sleek Low Body
      const bodyGeo = new THREE.BoxGeometry(4.4, 2.2, 9.5);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.8;
      body.castShadow = true;
      bmw.add(body);

      // Roof Coupe Top
      const roofGeo = new THREE.BoxGeometry(3.8, 1.6, 4.5);
      const roof = new THREE.Mesh(roofGeo, bodyMat);
      roof.position.set(0, 3.3, -0.5);
      bmw.add(roof);

      // Windshield
      const windshieldGeo = new THREE.PlaneGeometry(3.6, 1.8);
      const windshield = new THREE.Mesh(windshieldGeo, glassMat);
      windshield.position.set(0, 3.1, 1.8);
      windshield.rotation.x = -0.55;
      bmw.add(windshield);

      // Quad Exhaust Pipes + Flames
      bmw.add(createExhaust(-1.2, 0.9, -4.8));
      bmw.add(createExhaust(1.2, 0.9, -4.8));

      return bmw;
    }

    // Wheels Builder
    const wheelGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.9, 24);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.7 });

    function addWheels(parent) {
      const positions = [
        [-2.2, 1.1, 2.8], [2.2, 1.1, 2.8],
        [-2.2, 1.1, -2.8], [2.2, 1.1, -2.8]
      ];
      positions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(...pos);
        wheel.castShadow = true;
        parent.add(wheel);
      });
    }

    eccoMesh = buildEccoVan();
    addWheels(eccoMesh);
    vehicleGroup.add(eccoMesh);

    bmwMesh = buildBmwCar();
    addWheels(bmwMesh);
    vehicleGroup.add(bmwMesh);
    bmwMesh.visible = false;

    let activeCarType = 'ecco';

    function switchCar(type) {
      activeCarType = type;
      document.getElementById('btnEcco').classList.toggle('active', type === 'ecco');
      document.getElementById('btnBmw').classList.toggle('active', type === 'bmw');

      eccoMesh.visible = (type === 'ecco');
      bmwMesh.visible = (type === 'bmw');
    }

    // --- CAR PHYSICS & CONTROL SYSTEM ---
    const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
    let currentSpeed = 0;
    let gear = 1;
    const maxGears = 10;
    let steeringAngle = 0;

    // Gear Speeds Scaling Table (Max Gear 10 = 500,000 KM/H Limit)
    const gearMaxSpeeds = {
      1: 150,
      2: 400,
      3: 1200,
      4: 3500,
      5: 10000,
      6: 30000,
      7: 80000,
      8: 180000,
      9: 320000,
      10: 500000
    };

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w') keys.w = true;
      if (k === 's') keys.s = true;
      if (k === 'a') keys.a = true;
      if (k === 'd') keys.d = true;
      if (e.code === 'Space') keys.space = true;
      if (e.key === 'Shift') keys.shift = true;

      // Gear Shifts
      if (k === 'e') {
        if (gear < maxGears) gear++;
        updateGearUI();
      }
      if (k === 'q') {
        if (gear > 1) gear--;
        updateGearUI();
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w') keys.w = false;
      if (k === 's') keys.s = false;
      if (k === 'a') keys.a = false;
      if (k === 'd') keys.d = false;
      if (e.code === 'Space') keys.space = false;
      if (e.key === 'Shift') keys.shift = false;
    });

    function updateGearUI() {
      document.getElementById('gearDisplay').innerText = `G ${gear}`;
    }

    // --- GAME LOOP & ANIMATION ---
    const clock = new THREE.Clock();

    function updatePhysics() {
      const delta = clock.getDelta();
      const topSpeedLimit = gearMaxSpeeds[gear];

      // Acceleration Logic
      let accelPower = (topSpeedLimit * 0.4) + (gear * 150);
      if (keys.shift) {
        accelPower *= 2.5; // Nitro Beast Boost
      }

      if (keys.w) {
        if (currentSpeed < topSpeedLimit) {
          currentSpeed += accelPower * delta;
        }
      } else if (keys.s) {
        if (currentSpeed > -200) {
          currentSpeed -= accelPower * 0.8 * delta;
        }
      } else {
        // Natural Friction Drag
        currentSpeed *= 0.985;
      }

      // Handbrake Break Logic
      if (keys.space) {
        currentSpeed *= 0.88;
      }

      // Steering Logic
      const turnSens = 0.025 - Math.min(0.02, (Math.abs(currentSpeed) / 500000) * 0.02);
      if (keys.a) steeringAngle += turnSens;
      if (keys.d) steeringAngle -= turnSens;

      steeringAngle *= 0.9;
      vehicleGroup.rotation.y += steeringAngle * (currentSpeed / 200);

      // Move Vehicle Forward in 3D Space
      const moveDistance = (currentSpeed / 3.6) * delta;
      vehicleGroup.translateZ(moveDistance * 0.1);

      // Exhaust Fire Nitro Animation
      const isFire = keys.shift && Math.abs(currentSpeed) > 10;
      exhaustFlames.forEach(flame => {
        flame.visible = isFire;
        if (isFire) {
          flame.scale.set(1 + Math.random(), 1 + Math.random() * 2, 1 + Math.random());
        }
      });

      document.getElementById('nitroFx').classList.toggle('nitro-active', isFire);
      document.getElementById('nosText').innerText = isFire ? "🔥 EXHAUST FIRE ACTIVE!" : "EXHAUST READY";
      document.getElementById('nosText').style.color = isFire ? "#ff0055" : "#00ffcc";

      // Smooth Camera Follow System (Horizon Third-Person View)
      const targetVehicle = activeCarType === 'ecco' ? eccoMesh : bmwMesh;
      const camOffset = new THREE.Vector3(0, 12, -28);
      camOffset.applyQuaternion(vehicleGroup.quaternion);
      
      camera.position.lerp(vehicleGroup.position.clone().add(camOffset), 0.1);
      camera.lookAt(vehicleGroup.position.clone().add(new THREE.Vector3(0, 4, 15).applyQuaternion(vehicleGroup.quaternion)));

      // Update Speedometer UI
      document.getElementById('speedometer').innerText = Math.floor(Math.abs(currentSpeed)).toLocaleString();
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
